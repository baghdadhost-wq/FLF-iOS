name: Build F.LF IPA

on:
  push:
    branches: [main]
    paths-ignore: ['lf2/**', '.github/workflows/build-lf2.yml', 'openlf2/**', '.github/workflows/build-openlf2.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get game (F.LF engine + LF2_19 data)
        run: |
          mkdir -p www/F
          git clone --depth 1 https://github.com/Project-F/F.LF.git www/F/F.LF
          git clone --depth 1 https://github.com/Project-F/LF2_19.git www/F/LF2_19
          rm -rf www/F/*/.git www/F/F.LF/docs www/F/F.LF/tools www/F/F.LF/core/sample www/F/F.LF/core/docs
          # optional extra characters (see extra/README) are copied on top
          if [ -d extra/LF2_19 ]; then cp -R extra/LF2_19/. www/F/LF2_19/; fi
          cp web/flf-touch.js www/flf-touch.js
          cp -R web/lan www/lan
          cp web/tournament.js www/tournament.js
          cp web/stage.js web/stages.json www/
          # small engine fixes so the hidden characters added in extra/ run
          python3 web/patch-engine.py www/F/F.LF
          # Web Audio sound engine (iOS cannot play the original <audio> sound sprite)
          cp web/soundpack.js www/F/F.LF/LF/soundpack.js
          rm -f www/F/LF2_19/sound/soundpack.wav www/F/LF2_19/sound/soundpack.ac3
          du -sh www

      - name: Compile app
        run: |
          APP=Payload/FLF.app
          mkdir -p "$APP"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos swiftc -parse-as-library -O \
            -target arm64-apple-ios14.0 -sdk "$SDK" \
            -framework UIKit -framework WebKit -framework AVFoundation -framework Network \
            App/main.swift -o "$APP/FLF" 2>&1 | tee swiftc.log
          if [ ! -f "$APP/FLF" ]; then
            grep -E "error:|Undefined|ld:" swiftc.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp App/Info.plist "$APP/Info.plist"
          cp App/AppIcon60x60@2x.png App/AppIcon60x60@3x.png "$APP/"
          cp -R www "$APP/www"
          plutil -lint "$APP/Info.plist"
          file "$APP/FLF"
          zip -qry FLF.ipa Payload
          ls -lh FLF.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FLF-ipa
          path: FLF.ipa

      - name: Publish release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" FLF.ipa --title "F.LF iOS $TAG" \
            --notes "Unsigned IPA for LiveContainer. Download FLF.ipa below." --latest
